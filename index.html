<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 동네 불법 주차 문제 해결하기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fa;--fg:#1d2b3a;--chip:#dfe8f0;--on:#1f6fb2;--onfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10161d;--fg:#e8eef4;--chip:#223140;--on:#5aaef0;--onfg:#0b1620}}
:root[data-theme="dark"]{--bg:#10161d;--fg:#e8eef4;--chip:#223140;--on:#5aaef0;--onfg:#0b1620}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.stage{position:relative;width:min(96vw,calc(80vh*16/9));aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block}
.chips{position:absolute;top:2.5%;left:2%;right:2%;display:flex;gap:6px}
.chip{flex:1;text-align:center;font-size:clamp(9px,1.6vw,16px);font-weight:700;padding:5px 2px;border-radius:14px;background:var(--chip);color:var(--fg);opacity:.85;transition:all .4s;border:0;cursor:pointer;font-family:inherit}
.chip.on{background:var(--on);color:var(--onfg);opacity:1}
.cap{position:absolute;left:3%;right:3%;bottom:3%;background:rgba(10,20,30,.78);color:#fff;border-radius:10px;padding:1.2% 2%;text-align:center;font-size:clamp(12px,2.3vw,24px);line-height:1.5;font-weight:700}
.bar{display:flex;gap:10px;align-items:center;width:min(96vw,720px)}
.ctl{background:var(--on);color:var(--onfg);border:0;border-radius:18px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer}
.ctl:focus-visible,.chip:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.track{flex:1;height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.fill{height:100%;width:0;background:var(--on)}
</style>
</head>
<body>
<div class="stage">
<canvas id="c" width="1280" height="720"></canvas>
<div class="chips" id="chips"></div>
<div class="cap" id="cap"></div>
</div>
<div class="bar"><button class="ctl" id="pb">일시정지</button><div class="track"><div class="fill" id="fill"></div></div><button class="ctl" id="rp">처음부터</button></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720,SC=6,D=24;
var steps=['① 문제 발견','② 원인 분석','③ 해결 방안','④ 실천과 결과'];
var narr=['골목 양쪽에 차들이 불법으로 서 있어요. 구급차도 지나가지 못하고 아이들은 위험해요.',
'왜 생겼을까요? 주차 공간이 부족하고, 차가 늘었고, 단속과 인식도 부족했어요.',
'주민과 구청이 모여 공영주차장을 만들고 올바른 주차 캠페인을 열어요.',
'골목이 다시 안전해졌어요. 지역 문제는 함께할 때 해결돼요!'];
var chips=document.getElementById('chips'),cap=document.getElementById('cap'),fill=document.getElementById('fill');
var chipEls=steps.map(function(s,i){var b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=function(){t=i*SC;play=true;pb.textContent='일시정지'};chips.appendChild(b);return b});
function ease(t){return t<0?0:t>1?1:t*t*(3-2*t)}
function rr(px,py,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
function mix(a,b,k){return'rgb('+a.map(function(v,i){return Math.round(v+(b[i]-v)*k)}).join(',')+')'}
var houses=[[40,170,230,'#e9b872'],[230,150,280,'#d98b7a'],[400,190,210,'#8fb8d9'],[610,160,260,'#b9d49a'],[790,180,220,'#e0a0c0']];
function person(px,py,col,arms,s){s=s||1;x.fillStyle=col;x.beginPath();x.roundRect(px-16*s,py-40*s,32*s,60*s,10*s);x.fill();
 x.fillStyle='#f5cfa6';x.beginPath();x.arc(px,py-58*s,18*s,0,7);x.fill();
 x.strokeStyle=col;x.lineWidth=8*s;x.lineCap='round';x.beginPath();
 if(arms){x.moveTo(px-14*s,py-30*s);x.lineTo(px-34*s,py-62*s-arms*8);x.moveTo(px+14*s,py-30*s);x.lineTo(px+34*s,py-62*s+arms*8)}
 else{x.moveTo(px-14*s,py-28*s);x.lineTo(px-24*s,py-4*s);x.moveTo(px+14*s,py-28*s);x.lineTo(px+24*s,py-4*s)}x.stroke()}
function face(px,py,mood,s){s=s||1;x.fillStyle='#333';x.beginPath();x.arc(px-6*s,py-60*s,2*s,0,7);x.arc(px+6*s,py-60*s,2*s,0,7);x.fill();
 x.strokeStyle='#333';x.lineWidth=2*s;x.beginPath();if(mood>0)x.arc(px,py-54*s,6*s,.1,3.04);else x.arc(px,py-48*s,6*s,3.3,6.1);x.stroke()}
function car(px,py,col,s,amb,t){s=s||1;x.save();x.translate(px,py);x.scale(s,s);
 rr(-85,-62,170,42,12,col);rr(-52,-100,104,44,14,col);
 x.fillStyle='rgba(210,235,250,.95)';x.beginPath();x.roundRect(-44,-92,40,30,6);x.roundRect(4,-92,40,30,6);x.fill();
 x.fillStyle='#222';[[-52],[52]].forEach(function(w){x.beginPath();x.arc(w[0],-18,19,0,7);x.fill();x.fillStyle='#999';x.beginPath();x.arc(w[0],-18,8,0,7);x.fill();x.fillStyle='#222'});
 if(amb){x.fillStyle='#d6202a';x.fillRect(-40,-52,80,10);var on=Math.floor(t*6)%2;x.fillStyle=on?'#ff4a4a':'#4a7aff';x.beginPath();x.arc(0,-108,10,0,7);x.fill();
  if(on){x.fillStyle='rgba(255,80,80,.3)';x.beginPath();x.arc(0,-108,34,0,7);x.fill()}}
 x.restore()}
// illegal cars: x, base y, color, remove time
var cars=[[330,612,'#e05a4f',15.0,1],[700,612,'#3f8f6a',15.6,1],[1010,612,'#e0b020',16.2,1],[500,694,'#6a5ab0',14.8,1],[860,694,'#3b8fd0',15.4,1]];
function lot(t){var a=ease((t-13.8)/.8);if(a<=0)return;x.save();x.globalAlpha=a;
 x.fillStyle='#cfd6de';x.fillRect(930,330,330,230);x.fillStyle='#8a97a6';x.fillRect(930,330,330,18);
 rr(1035,260,120,60,10,'#1f6fb2');x.fillStyle='#fff';x.font='900 44px "Noto Sans KR",sans-serif';x.textAlign='center';x.fillText('P',1095,305);
 x.font='700 20px "Noto Sans KR",sans-serif';x.fillText('공영주차장',1095,340);
 x.strokeStyle='#fff';x.lineWidth=4;for(var k=0;k<4;k++){x.beginPath();x.moveTo(955+k*85,420);x.lineTo(955+k*85,545);x.stroke()}
 x.restore();
 var lc=[['#e05a4f',15.6],['#3f8f6a',16.2],['#e0b020',16.8]];
 lc.forEach(function(l,i){var b=ease((t-l[1])/.5);if(b>0)car(998+i*85,540+(1-b)*-20,l[0],.42,0,t)})}
function scene(t){
 var bad=t<12.5?1:1-ease((t-12.5)/3);if(t>=18)bad=0;
 var g=x.createLinearGradient(0,0,0,H*.7);g.addColorStop(0,mix([120,200,240],[170,175,175],bad*.5));g.addColorStop(1,mix([215,238,250],[205,200,190],bad*.5));
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle=mix([255,224,110],[215,205,150],bad);x.beginPath();x.arc(1120,110,52,0,7);x.fill();
 houses.forEach(function(h){x.fillStyle=h[3];x.fillRect(h[0],560-h[2],h[1],h[2]);x.fillStyle='rgba(255,255,255,.75)';
  for(var wy=0;wy<h[2]-80;wy+=80)for(var wx=22;wx<h[1]-40;wx+=60)x.fillRect(h[0]+wx,560-h[2]+24+wy,34,40);
  x.fillStyle='rgba(0,0,0,.15)';x.fillRect(h[0],560-h[2],h[1],10)});
 x.fillStyle='#7d838b';x.fillRect(0,560,W,160);x.fillStyle='#b9bdc3';x.fillRect(0,560,W,18);
 x.fillStyle='rgba(255,255,255,.6)';for(var d=0;d<W;d+=120)x.fillRect(d,650,60,6);
 var fl=ease((t-18.5)/3);if(fl>0)for(var f=0;f<24;f++){var fx=30+f*53,fy=560;x.strokeStyle='#4c9a4a';x.lineWidth=3;x.beginPath();x.moveTo(fx,fy);x.lineTo(fx,fy-22*fl);x.stroke();x.fillStyle=['#ff7aa8','#ffd23f','#ff9a4a'][f%3];x.beginPath();x.arc(fx,fy-22*fl,7*fl,0,7);x.fill()}
 lot(t);
 var sec=Math.floor(t/SC);
 // illegal cars
 cars.forEach(function(k,i){var ap=ease((t-(.4+i*.7))/.6),go=ease((t-k[3])/1.1);if(ap<=0||go>=1)return;
  var px=k[0]+go*(go>0?(k[0]<760?-700:700):0)+(1-ap)*(i%2?500:-500);x.globalAlpha=1-go*.3;car(px,k[1],k[2],1,0,t);x.globalAlpha=1;
  if(sec===0&&t>3){x.font='900 26px "Noto Sans KR",sans-serif';x.fillStyle='#d6202a';x.textAlign='center';x.fillText('불법 주차!',px,k[1]-122+Math.sin(t*5+i)*3)}});
 if(sec===0){var jam=ease((t-2)/1);car(160,694,'#f2f2f2',1,1,t);
  x.font='900 28px "Noto Sans KR",sans-serif';x.fillStyle='#d6202a';x.textAlign='center';x.globalAlpha=jam*(.6+.4*Math.sin(t*8));x.fillText('삐뽀삐뽀! 못 지나가요',170,470);x.globalAlpha=1;
  person(1180,595,'#c0564f',1,.9);face(1180,595,-1,.9);x.font='900 24px "Noto Sans KR",sans-serif';x.fillStyle='#d6202a';x.fillText('위험해요!',1180,500)}
 if(sec===1){x.fillStyle='rgba(15,25,40,.62)';x.fillRect(0,0,W,H);
  x.fillStyle='#fff';x.font='900 44px "Noto Sans KR",sans-serif';x.textAlign='center';x.globalAlpha=ease((t-6.1)/.5);x.fillText('왜 불법 주차가 늘었을까?',W/2,120);x.globalAlpha=1;
  var cs=[['🅿️','주차 공간이 부족해요','집 근처에 댈 곳이 없어요'],['🚗','차가 점점 늘었어요','집집마다 차가 있어요'],['👀','단속과 인식이 부족해요','잠깐은 괜찮다고 생각해요']];
  cs.forEach(function(k,i){var a=ease((t-(6.8+i*1.4))/.5);if(a<=0)return;x.save();x.translate(W/2+(i-1)*400,H/2+30+(1-a)*40);x.globalAlpha=a;
   rr(-170,-170,340,340,22,'#fff');x.font='90px sans-serif';x.textAlign='center';x.fillText(k[0],0,-50);
   x.fillStyle='#1d2b3a';x.font='900 28px "Noto Sans KR",sans-serif';x.fillText(k[1],0,40);x.fillStyle='#55657a';x.font='400 23px "Noto Sans KR",sans-serif';x.fillText(k[2],0,90);x.restore()})}
 if(sec===2){var pa=ease((t-12.2)/.6);
  [[200,'#3b6fb6'],[330,'#c0564f'],[560,'#6a4fb0']].forEach(function(p,i){x.globalAlpha=pa;person(p[0],600,p[1],i===1?1:0);face(p[0],600,1);x.globalAlpha=1});
  if(t>12.6&&t<14.6){x.save();x.globalAlpha=ease((t-12.6)/.4)*(1-ease((t-14.2)/.4));rr(200,400,340,70,18,'#fff');x.fillStyle='#1d2b3a';x.font='700 26px "Noto Sans KR",sans-serif';x.textAlign='center';x.fillText('공영주차장을 만들어요!',370,445);x.restore()}
  var ba=ease((t-17)/.8);if(ba>0){x.save();x.translate(W/2-100,200);x.scale(ba,ba);rr(-330,-40,660,80,14,'#ffd23f');x.fillStyle='#1d2b3a';x.font='900 38px "Noto Sans KR",sans-serif';x.textAlign='center';x.fillText('정해진 곳에 주차해요!',0,14);x.restore()}}
 if(sec===3){
  var ag=ease((t-19)/3.6);car(-150+ag*1500,694,'#f2f2f2',1,1,t);
  var lc=[['#e05a4f'],['#3f8f6a'],['#e0b020']];lc.forEach(function(l,i){car(998+i*85,540,l[0],.42,0,t)});
  x.globalAlpha=1;[[200,'#3b6fb6'],[420,'#c0564f'],[620,'#6a4fb0'],[760,'#2f9a86']].forEach(function(p,i){var j=Math.sin(t*4+i)*.8+1;person(p[0],598,p[1],j);face(p[0],598,1)});
  for(var s=0;s<14;s++){var a=(t*1.2+s*.37)%1,sx=120+s*90,sy=500-a*140;x.globalAlpha=1-a;x.fillStyle='#fff7b0';x.font='28px sans-serif';x.textAlign='center';x.fillText('✨',sx,sy);x.globalAlpha=1}}
}
function loop(ts){if(last===null)last=ts;var dt=Math.min(.1,(ts-last)/1000);last=ts;if(play){t+=dt;if(t>=D)t=0}
 scene(t);var lt=t%SC,fa=Math.max(1-lt/.4,(lt-(SC-.4))/.4);if(fa>0){x.fillStyle='rgba(255,255,255,'+Math.min(.9,fa)*.9+')';x.fillRect(0,0,W,H)}
 var sec=Math.min(3,Math.floor(t/SC));chipEls.forEach(function(e,i){e.classList.toggle('on',i===sec)});
 if(cap.textContent!==narr[sec])cap.textContent=narr[sec];fill.style.width=(t/D*100)+'%';requestAnimationFrame(loop)}
var t=0,last=null,play=true,pb=document.getElementById('pb');
pb.onclick=function(){play=!play;pb.textContent=play?'일시정지':'재생'};
document.getElementById('rp').onclick=function(){t=0;play=true;pb.textContent='일시정지'};
(document.fonts&&document.fonts.load?document.fonts.load('700 20px "Noto Sans KR"').catch(function(){}):Promise.resolve()).then(function(){requestAnimationFrame(loop)});
})();
</script>
</body>
</html>
