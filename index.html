<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#10161d;--fg:#e8eef4;--chip:#223140;--on:#5aaef0;--onfg:#0b1620}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.wrap{display:flex;flex-direction:column;gap:8px;width:min(96vw,calc(62vh*16/9));box-sizing:border-box}
.chips{display:flex;gap:6px}
.chip{flex:1;text-align:center;font-size:clamp(10px,1.5vw,16px);font-weight:700;padding:6px 2px;border-radius:14px;background:var(--chip);color:var(--fg);opacity:.85;transition:all .4s;border:0;cursor:pointer;font-family:inherit}
.chip.on{background:var(--on);color:var(--onfg);opacity:1}
canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;object-fit:contain}
.cap{box-sizing:border-box;min-height:3.4em;display:flex;align-items:center;justify-content:center;background:var(--chip);border-radius:10px;padding:8px 16px;text-align:center;font-size:clamp(13px,2vw,22px);line-height:1.5;font-weight:700}
.bar{display:flex;gap:10px;align-items:center}
.ctl{background:var(--on);color:var(--onfg);border:0;border-radius:18px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.ctl:focus-visible,.chip:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.track{flex:1;height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.fill{height:100%;width:0;background:var(--on)}
.wrap.fs{position:fixed;inset:0;width:100%;height:100%;padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));background:var(--bg);z-index:10}
.fs canvas{flex:1 1 0;min-height:0;height:0;aspect-ratio:auto;border-radius:0}
.fs .cap{font-size:clamp(16px,2.6vw,32px)}
</style>
</head>

<div class="bar"><button class="ctl" id="pb">일시정지</button><div class="track"><div class="fill" id="fill"></div></div><button class="ctl" id="rp">처음부터</button><button class="ctl" id="fs">전체화면</button></div>
